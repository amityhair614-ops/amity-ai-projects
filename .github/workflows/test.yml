# 計算部分の単体テスト（tests/*.test.mjs）を自動で実行する（アプリと同じく、字幕の言葉の区切りの辞書を読み込んでから）。
# ブラウザを使う通しテスト（tests/e2e）は実行しない。
name: テスト

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: 単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 字幕の言葉の区切りに使う kuromoji（devDependencies）を入れてから、辞書を読み込んだ状態でテストする（package.json の npm test）
      - run: npm ci
      - run: npm test
